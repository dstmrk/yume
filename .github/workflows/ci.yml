# The examination of each change.
#
# The section Commands of CLAUDE.md gives four commands before a commit. A
# person can forget one command. This workflow runs each one, thus a pull
# request shows the result before the merge.
#
# The workflow also runs the test suites of the hooks. Vitest does not find
# those suites, because a hook is a Bash script.
name: CI

on:
  push:
    branches: [main]
    # A tag `v*` publishes the image. The jobs `check` and `image` run again on
    # that tag, thus the publication examines the exact commit of the release.
    tags: ["v*"]
  pull_request:

# The workflow reads the repository. It writes nothing.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Node 22 LTS. Paragraph 2 of docs/architecture.md gives the reason.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Types
        run: npm run typecheck

      - name: Lint and format
        run: npm run check

      - name: Build
        run: npm run build

      # Each hook makes a rule of CLAUDE.md mechanical. A hook that stops its
      # block must make these suites fail.
      - name: Hooks
        run: |
          bash .claude/hooks/test-block-commit-on-main.sh
          bash .claude/hooks/test-block-push-to-main.sh
          bash .claude/hooks/test-block-private-data-commit.sh

  # The build of the image takes minutes. The job `image` needs it only for a
  # change of the container. This job reads the names of the files of the pull
  # request. Then the job `image` reads this result.
  #
  # These four files give the content of the image. A change of `src/` arrives
  # in the image, but the jobs `check` and the tests of Vitest examine that
  # code. Add a file to this list when the `Dockerfile` copies a new path.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.files.outputs.docker }}
    steps:
      - uses: actions/checkout@v6

      # The checkout gives the merge commit with no history. The fetch takes
      # the commit of the base, thus `git diff` reads the two trees.
      - id: files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          names="$(git diff --name-only "$BASE_SHA" HEAD)"
          pattern='^(Dockerfile|\.dockerignore|package\.json|package-lock\.json)$'
          if printf '%s\n' "$names" | grep -qE "$pattern"; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  # Vitest examines no file of the container. This job builds the image and
  # then it reads the application in the container. Thus a defect of the
  # Dockerfile stops the pull request, and not the deployment on the home
  # server.
  #
  # The job runs on a tag `v*` and on a pull request that changes a file of the
  # image. A push to `main` builds no image: the pull request of that commit
  # gave the same result.
  #
  # `!cancelled()` is necessary. On a tag the job `changes` does not run, and a
  # job that waits for a job with no run also does not run.
  image:
    needs: changes
    if: >-
      ${{ !cancelled()
      && (startsWith(github.ref, 'refs/tags/v')
      || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # The home server is arm64, but this job builds for amd64: a build with
      # QEMU is slow, and the Dockerfile is the same for the two platforms.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: yume:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The server stops without BETTER_AUTH_SECRET. Refer to paragraph 4 of
      # docs/architecture.md. This value is only for the workflow.
      - name: Start the container
        run: |
          docker run -d --name yume-ci -p 3000:3000 \
            -e BETTER_AUTH_SECRET=a-secret-for-the-workflow-and-for-no-server \
            yume:ci

      # The container applies the migrations and writes the catalogue before
      # the server. Therefore the first answer arrives some seconds late.
      - name: Wait for the state of the container
        run: |
          for i in $(seq 1 30); do
            state="$(docker inspect --format='{{.State.Status}}' yume-ci || true)"
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      # Each route of the data needs a session.
      - name: Examine the protection of the routes
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3000/api/catalogue)"
          test "$code" = "401"

      # The catalogue shows that the migrations and the seed ran. The page
      # shows that the server supplies the files of the client from dist/.
      #
      # The container holds no user, thus the log gives the code of the setup.
      # This step is the only examination of that code with a real container.
      #
      # The origin of the request is the value of BETTER_AUTH_URL, and the
      # default value of that variable holds the name localhost. Better Auth
      # refuses a request from an other origin.
      - name: Examine the catalogue and the page
        run: |
          code="$(docker logs yume-ci 2>&1 | grep -o 'code=[A-Z0-9]*' | cut -d= -f2)"
          test -n "$code"
          curl -fsS -X POST \
            http://127.0.0.1:3000/api/auth/sign-up/email \
            -H 'content-type: application/json' \
            -H 'origin: http://localhost:3000' \
            -d "{\"name\":\"CI\",\"email\":\"ci@example.com\",\"password\":\"una-parola-lunga\",\"inviteCode\":\"$code\"}" \
            > /dev/null
          curl -fsS -c cookies.txt -X POST \
            http://127.0.0.1:3000/api/auth/sign-in/email \
            -H 'content-type: application/json' \
            -H 'origin: http://localhost:3000' \
            -d '{"email":"ci@example.com","password":"una-parola-lunga"}' \
            > /dev/null
          curl -fsS -b cookies.txt http://127.0.0.1:3000/api/catalogue \
            | grep -q ba-club
          curl -fsS http://127.0.0.1:3000/ | grep -q 'id="root"'

      - name: Give the log of the container
        if: failure()
        run: docker logs yume-ci

      - name: Stop the container
        if: always()
        run: docker rm -f yume-ci

  # The image of the home server. This job runs only after a push of a tag `v*`,
  # thus a pull request and a push to main publish no image. A release is then a
  # decision of a person, and not each merge. `needs` holds the job of the tests
  # and the job of the container: an image with a test that fails must not
  # arrive on the registry.
  #
  # A package of GHCR that a workflow publishes with GITHUB_TOKEN takes the
  # visibility of the repository. This repository is public, therefore
  # `docker compose up` needs no `docker login`.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The job writes the package of the registry of GitHub.
      packages: write
    steps:
      - uses: actions/checkout@v6

      # The home server is arm64 and this runner is amd64. QEMU gives the
      # second platform. The build compiles nothing: `better-sqlite3` holds the
      # binary of each platform in `prebuilds/`, and each `npm ci` of the
      # Dockerfile holds `--ignore-scripts`. Therefore the build with QEMU only
      # writes the files of the client with Vite.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Sign in on the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag `latest` is for compose.yaml. The name of the git tag gives one
      # image for each release, thus a person can go back to the image before a
      # defect.
      - name: Build the image and publish it
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
