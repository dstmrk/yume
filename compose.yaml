# Yume on a home server. Refer to paragraph 7 of `docs/architecture.md`.
#
# The directory `./data` holds the database and the backups. Give it to the
# user 1000 before the first start:
#   mkdir -p data && sudo chown 1000:1000 data
#
# This file gives no TLS. Put Yume behind Tailscale, behind a Cloudflare Tunnel
# or behind a reverse proxy with a certificate. Better Auth sends the session
# cookies with the attribute `secure`, thus a login on plain HTTP is not
# possible.

services:
  yume:
    build: .
    image: yume
    container_name: yume
    restart: unless-stopped
    # Only the local machine reads this port. The reverse proxy gives the
    # access from the network.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    environment:
      DATABASE_URL: /data/yume.db
      PORT: "3000"
      # Better Auth signs the cookies and the tokens with this key. Write a
      # random value in the file `.env`, near this file:
      #   echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> .env
      # A new key removes each session. The server stops without this value.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?write a random value in .env}
      # The origin of the application, with the name of the reverse proxy, for
      # example https://yume.example.com. Better Auth refuses a request from an
      # other origin.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    # The limits keep the other services of the home server free. The largest
    # quantity of memory is at the start, with the migrations and the seed.
    mem_limit: 512m
    cpus: "1.0"
    # Without a limit, the file of the log grows without an end on the disk of
    # the home server.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
