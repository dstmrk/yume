# The examination of each change.
#
# The section Commands of CLAUDE.md gives four commands before a commit. A
# person can forget one command. This workflow runs each one, thus a pull
# request shows the result before the merge.
#
# The workflow also runs the test suites of the hooks. Vitest does not find
# those suites, because a hook is a Bash script.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow reads the repository. It writes nothing.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Node 22 LTS. Paragraph 2 of docs/architecture.md gives the reason.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Types
        run: npm run typecheck

      - name: Lint and format
        run: npm run check

      - name: Build
        run: npm run build

      # Each hook makes a rule of CLAUDE.md mechanical. A hook that stops its
      # block must make these suites fail.
      - name: Hooks
        run: |
          bash .claude/hooks/test-block-commit-on-main.sh
          bash .claude/hooks/test-block-push-to-main.sh
          bash .claude/hooks/test-block-private-data-commit.sh

  # Vitest examines no file of the container. This job builds the image and
  # then it reads the application in the container. Thus a defect of the
  # Dockerfile stops the pull request, and not the deployment on the home
  # server.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # The home server is arm64, but this job builds for amd64: a build with
      # QEMU is slow, and the Dockerfile is the same for the two platforms.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: yume:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: docker run -d --name yume-ci -p 3000:3000 yume:ci

      # The container applies the migrations and writes the catalogue before
      # the server. Therefore the first answer arrives some seconds late.
      - name: Wait for the state of the container
        run: |
          for i in $(seq 1 30); do
            state="$(docker inspect --format='{{.State.Status}}' yume-ci || true)"
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      # The catalogue shows that the migrations and the seed ran. The page
      # shows that the server supplies the files of the client from dist/.
      - name: Examine the catalogue and the page
        run: |
          curl -fsS http://127.0.0.1:3000/api/catalogue | grep -q ba-club
          curl -fsS http://127.0.0.1:3000/ | grep -q 'id="root"'

      - name: Give the log of the container
        if: failure()
        run: docker logs yume-ci

      - name: Stop the container
        if: always()
        run: docker rm -f yume-ci
