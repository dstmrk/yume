# The examination of each change.
#
# The section Commands of CLAUDE.md gives four commands before a commit. A
# person can forget one command. This workflow runs each one, thus a pull
# request shows the result before the merge.
#
# The workflow also runs the test suites of the hooks. Vitest does not find
# those suites, because a hook is a Bash script.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow reads the repository. It writes nothing.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Node 22 LTS. Paragraph 2 of docs/architecture.md gives the reason.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Types
        run: npm run typecheck

      - name: Lint and format
        run: npm run check

      - name: Build
        run: npm run build

      # Each hook makes a rule of CLAUDE.md mechanical. A hook that stops its
      # block must make these suites fail.
      - name: Hooks
        run: |
          bash .claude/hooks/test-block-commit-on-main.sh
          bash .claude/hooks/test-block-push-to-main.sh
          bash .claude/hooks/test-block-private-data-commit.sh

  # Vitest examines no file of the container. This job builds the image and
  # then it reads the application in the container. Thus a defect of the
  # Dockerfile stops the pull request, and not the deployment on the home
  # server.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # The home server is arm64, but this job builds for amd64: a build with
      # QEMU is slow, and the Dockerfile is the same for the two platforms.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: yume:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The server stops without BETTER_AUTH_SECRET. Refer to paragraph 4 of
      # docs/architecture.md. This value is only for the workflow.
      - name: Start the container
        run: |
          docker run -d --name yume-ci -p 3000:3000 \
            -e BETTER_AUTH_SECRET=a-secret-for-the-workflow-and-for-no-server \
            yume:ci

      # The container applies the migrations and writes the catalogue before
      # the server. Therefore the first answer arrives some seconds late.
      - name: Wait for the state of the container
        run: |
          for i in $(seq 1 30); do
            state="$(docker inspect --format='{{.State.Status}}' yume-ci || true)"
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      # Each route of the data needs a session. The image holds no npm, thus
      # the script of the user runs with node.
      - name: Examine the protection of the routes
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3000/api/catalogue)"
          test "$code" = "401"

      # The catalogue shows that the migrations and the seed ran. The page
      # shows that the server supplies the files of the client from dist/.
      #
      # The origin of the request is the value of BETTER_AUTH_URL, and the
      # default value of that variable holds the name localhost. Better Auth
      # refuses a request from an other origin.
      - name: Examine the catalogue and the page
        run: |
          docker exec yume-ci node --experimental-strip-types \
            src/server/scripts/user.ts ci@example.com CI una-parola-lunga
          curl -fsS -c cookies.txt -X POST \
            http://127.0.0.1:3000/api/auth/sign-in/email \
            -H 'content-type: application/json' \
            -H 'origin: http://localhost:3000' \
            -d '{"email":"ci@example.com","password":"una-parola-lunga"}' \
            > /dev/null
          curl -fsS -b cookies.txt http://127.0.0.1:3000/api/catalogue \
            | grep -q ba-club
          curl -fsS http://127.0.0.1:3000/ | grep -q 'id="root"'

      - name: Give the log of the container
        if: failure()
        run: docker logs yume-ci

      - name: Stop the container
        if: always()
        run: docker rm -f yume-ci
